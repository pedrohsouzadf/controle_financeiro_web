AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Meu Financeiro - backend serverless (API Gateway HTTP API + Lambda +
  DynamoDB) Substitui o Google Sheets/Apps Script por uma stack AWS.

  '
Parameters:
  ApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: "Chave secreta que o site vai enviar no header x-api-key em toda\
      \ requisi\xE7\xE3o. Gere uma com: openssl rand -hex 24\n"
  WhatsAppRecipientNumber:
    Type: String
    Description: "Seu n\xFAmero de WhatsApp que vai receber o lembrete (o mesmo n\xFA\
      mero que voc\xEA usou para ativar o CallMeBot), no formato internacional sem\
      \ espa\xE7os/s\xEDmbolos. Ex: 5561999999999\n"
  CallMeBotApiKey:
    Type: String
    NoEcho: true
    Description: "Apikey que o CallMeBot te enviou por WhatsApp depois de voc\xEA\
      \ mandar a mensagem de ativa\xE7\xE3o para o n\xFAmero deles. Veja o Passo 6\
      \ do README.\n"
Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures:
    - arm64
Resources:
  FinancasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: meu-financeiro
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
  FinancasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: FinancasFunction
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME:
            Ref: FinancasTable
          API_KEY:
            Ref: ApiKeyValue
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FinancasTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FinancasHttpApi
            Path: /data
            Method: get
        Mutate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FinancasHttpApi
            Path: /data
            Method: post
    Metadata:
      SamResourceId: FinancasFunction
  LembreteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: LembreteFunction
      Handler: lembrete.handler
      Timeout: 15
      Environment:
        Variables:
          CALLMEBOT_PHONE:
            Ref: WhatsAppRecipientNumber
          CALLMEBOT_APIKEY:
            Ref: CallMeBotApiKey
      Events:
        LembreteDiario:
          Type: Schedule
          Properties:
            Schedule: cron(0 23 * * ? *)
            Description: "Lembrete di\xE1rio no WhatsApp \xE0s 20h (hor\xE1rio de\
              \ Bras\xEDlia)"
            Enabled: true
    Metadata:
      SamResourceId: LembreteFunction
  FinancasHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - x-api-key
Outputs:
  ApiUrl:
    Description: "URL da API \u2014 cole em js/config.js"
    Value:
      Fn::Sub: https://${FinancasHttpApi}.execute-api.${AWS::Region}.amazonaws.com/data
  TableName:
    Description: Nome da tabela DynamoDB criada
    Value:
      Ref: FinancasTable
