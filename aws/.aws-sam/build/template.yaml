AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'Meu Financeiro - backend serverless (API Gateway HTTP API + Lambda +
  DynamoDB) Substitui o Google Sheets/Apps Script por uma stack AWS.

  '
Parameters:
  ApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: "Chave secreta que o site vai enviar no header x-api-key em toda\
      \ requisi\xE7\xE3o. Gere uma com: openssl rand -hex 24\n"
  WhatsAppRecipientNumber:
    Type: String
    Description: "Seu n\xFAmero de WhatsApp que vai receber o lembrete (o mesmo n\xFA\
      mero que voc\xEA usou para ativar o CallMeBot), no formato internacional sem\
      \ espa\xE7os/s\xEDmbolos. Ex: 5561999999999\n"
  CallMeBotApiKey:
    Type: String
    NoEcho: true
    Description: "Apikey que o CallMeBot te enviou por WhatsApp depois de voc\xEA\
      \ mandar a mensagem de ativa\xE7\xE3o para o n\xFAmero deles. Veja o Passo 6\
      \ do README.\n"
  PluggyClientId:
    Type: String
    NoEcho: true
    Description: "Client ID da sua aplica\xE7\xE3o no Dashboard da Pluggy (dashboard.pluggy.ai).\
      \ Veja o Passo 7 do README.\n"
  PluggyClientSecret:
    Type: String
    NoEcho: true
    Description: "Client Secret da sua aplica\xE7\xE3o no Dashboard da Pluggy.\n"
  PluggyItemIds:
    Type: String
    Description: "Um ou mais itemId das conex\xF5es \"Meu Pluggy\" vinculadas \xE0\
      \ sua aplica\xE7\xE3o (uma por banco conectado), separados por v\xEDrgula.\n"
Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures:
    - arm64
Resources:
  FinancasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: meu-financeiro
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
      - AttributeName: pk
        AttributeType: S
      - AttributeName: sk
        AttributeType: S
      KeySchema:
      - AttributeName: pk
        KeyType: HASH
      - AttributeName: sk
        KeyType: RANGE
  FinancasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: FinancasFunction
      Handler: index.handler
      Timeout: 25
      Environment:
        Variables:
          TABLE_NAME:
            Ref: FinancasTable
          API_KEY:
            Ref: ApiKeyValue
          PLUGGY_CLIENT_ID:
            Ref: PluggyClientId
          PLUGGY_CLIENT_SECRET:
            Ref: PluggyClientSecret
          PLUGGY_ITEM_IDS:
            Ref: PluggyItemIds
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FinancasTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FinancasHttpApi
            Path: /data
            Method: get
        Mutate:
          Type: HttpApi
          Properties:
            ApiId:
              Ref: FinancasHttpApi
            Path: /data
            Method: post
    Metadata:
      SamResourceId: FinancasFunction
  LembreteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: LembreteFunction
      Handler: lembrete.handler
      Timeout: 15
      Environment:
        Variables:
          CALLMEBOT_PHONE:
            Ref: WhatsAppRecipientNumber
          CALLMEBOT_APIKEY:
            Ref: CallMeBotApiKey
      Events:
        LembreteDiario:
          Type: Schedule
          Properties:
            Schedule: cron(0 23 * * ? *)
            Description: "Lembrete di\xE1rio no WhatsApp \xE0s 20h (hor\xE1rio de\
              \ Bras\xEDlia)"
            Enabled: true
    Metadata:
      SamResourceId: LembreteFunction
  PluggySyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: PluggySyncFunction
      Handler: pluggy-sync.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME:
            Ref: FinancasTable
          PLUGGY_CLIENT_ID:
            Ref: PluggyClientId
          PLUGGY_CLIENT_SECRET:
            Ref: PluggyClientSecret
          PLUGGY_ITEM_IDS:
            Ref: PluggyItemIds
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: FinancasTable
      Events:
        SincronizacaoDiaria:
          Type: Schedule
          Properties:
            Schedule: cron(0 9 * * ? *)
            Description: "Sincroniza\xE7\xE3o di\xE1ria com a Pluggy \xE0s 6h (hor\xE1\
              rio de Bras\xEDlia)"
            Enabled: true
    Metadata:
      SamResourceId: PluggySyncFunction
  FinancasHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
        - '*'
        AllowMethods:
        - GET
        - POST
        - OPTIONS
        AllowHeaders:
        - Content-Type
        - x-api-key
Outputs:
  ApiUrl:
    Description: "URL da API \u2014 cole em js/config.js"
    Value:
      Fn::Sub: https://${FinancasHttpApi}.execute-api.${AWS::Region}.amazonaws.com/data
  TableName:
    Description: Nome da tabela DynamoDB criada
    Value:
      Ref: FinancasTable
