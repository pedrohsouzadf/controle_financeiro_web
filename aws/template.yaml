AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Meu Financeiro - backend serverless (API Gateway HTTP API + Lambda + DynamoDB)
  Substitui o Google Sheets/Apps Script por uma stack AWS.

Parameters:
  ApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      Chave secreta que o site vai enviar no header x-api-key em toda
      requisição. Gere uma com: openssl rand -hex 24

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures: [arm64]

Resources:
  FinancasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: meu-financeiro
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  FinancasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref FinancasTable
          API_KEY: !Ref ApiKeyValue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FinancasTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancasHttpApi
            Path: /data
            Method: get
        Mutate:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancasHttpApi
            Path: /data
            Method: post

  FinancasHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - x-api-key

Outputs:
  ApiUrl:
    Description: URL da API — cole em js/config.js
    Value: !Sub "https://${FinancasHttpApi}.execute-api.${AWS::Region}.amazonaws.com/data"
  TableName:
    Description: Nome da tabela DynamoDB criada
    Value: !Ref FinancasTable
