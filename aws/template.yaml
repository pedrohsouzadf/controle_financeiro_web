AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Meu Financeiro - backend serverless (API Gateway HTTP API + Lambda + DynamoDB)
  Substitui o Google Sheets/Apps Script por uma stack AWS.

Parameters:
  ApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      Chave secreta que o site vai enviar no header x-api-key em toda
      requisição. Gere uma com: openssl rand -hex 24

  WhatsAppPhoneNumberId:
    Type: String
    Description: >
      ID do número de telefone do WhatsApp Cloud API (Meta), encontrado no
      painel do app em WhatsApp > Introdução.

  WhatsAppRecipientNumber:
    Type: String
    Description: >
      Seu número de WhatsApp que vai receber o lembrete, no formato
      internacional sem espaços/símbolos. Ex: 5561999999999

  WhatsAppTemplateName:
    Type: String
    Default: lembrete_financas_diario
    Description: >
      Nome do template aprovado no WhatsApp Manager (Meta) usado para enviar
      o lembrete diário.

  WhatsAppTokenParamName:
    Type: String
    Default: /financas/whatsapp-token
    Description: >
      Nome do parâmetro no SSM Parameter Store (SecureString) onde o token
      de acesso do WhatsApp Cloud API está guardado. Crie-o manualmente após
      o deploy com:
      aws ssm put-parameter --name "/financas/whatsapp-token" --type SecureString --value "SEU_TOKEN"

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures: [arm64]

Resources:
  FinancasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: meu-financeiro
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  FinancasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref FinancasTable
          API_KEY: !Ref ApiKeyValue
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FinancasTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancasHttpApi
            Path: /data
            Method: get
        Mutate:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancasHttpApi
            Path: /data
            Method: post

  # Envia todo dia às 20h (horário de Brasília, UTC-3, sem horário de verão)
  # um lembrete no WhatsApp com o saldo real do mês e se já houve lançamento
  # de despesas no dia, puxando os dados direto da tabela DynamoDB.
  LembreteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: lembrete.handler
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref FinancasTable
          WHATSAPP_TOKEN_PARAM: !Ref WhatsAppTokenParamName
          PHONE_NUMBER_ID: !Ref WhatsAppPhoneNumberId
          RECIPIENT_NUMBER: !Ref WhatsAppRecipientNumber
          TEMPLATE_NAME: !Ref WhatsAppTemplateName
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FinancasTable
        - Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${WhatsAppTokenParamName}"
      Events:
        LembreteDiario:
          Type: Schedule
          Properties:
            Schedule: "cron(0 23 * * ? *)"
            Description: "Lembrete diário no WhatsApp às 20h (horário de Brasília)"
            Enabled: true

  FinancasHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - x-api-key

Outputs:
  ApiUrl:
    Description: URL da API — cole em js/config.js
    Value: !Sub "https://${FinancasHttpApi}.execute-api.${AWS::Region}.amazonaws.com/data"
  TableName:
    Description: Nome da tabela DynamoDB criada
    Value: !Ref FinancasTable
