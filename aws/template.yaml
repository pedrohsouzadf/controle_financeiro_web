AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Meu Financeiro - backend serverless (API Gateway HTTP API + Lambda + DynamoDB)
  Substitui o Google Sheets/Apps Script por uma stack AWS.

Parameters:
  ApiKeyValue:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: >
      Chave secreta que o site vai enviar no header x-api-key em toda
      requisição. Gere uma com: openssl rand -hex 24

  WhatsAppRecipientNumber:
    Type: String
    Description: >
      Seu número de WhatsApp que vai receber o lembrete (o mesmo número que
      você usou para ativar o CallMeBot), no formato internacional sem
      espaços/símbolos. Ex: 5561999999999

  CallMeBotApiKey:
    Type: String
    NoEcho: true
    Description: >
      Apikey que o CallMeBot te enviou por WhatsApp depois de você mandar a
      mensagem de ativação para o número deles. Veja o Passo 6 do README.

  PluggyClientId:
    Type: String
    NoEcho: true
    Description: >
      Client ID da sua aplicação no Dashboard da Pluggy (dashboard.pluggy.ai).
      Veja o Passo 7 do README.

  PluggyClientSecret:
    Type: String
    NoEcho: true
    Description: >
      Client Secret da sua aplicação no Dashboard da Pluggy.

  PluggyItemIds:
    Type: String
    Description: >
      Um ou mais itemId das conexões "Meu Pluggy" vinculadas à sua
      aplicação (uma por banco conectado), separados por vírgula.

Globals:
  Function:
    Timeout: 10
    MemorySize: 128
    Runtime: nodejs22.x
    Architectures: [arm64]

Resources:
  FinancasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: meu-financeiro
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  FinancasFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      # O botão "Atualizar" (ação syncPluggy) chama a API da Pluggy várias
      # vezes antes de responder (transações + faturas + investimentos) —
      # folga em relação ao padrão de 10s, ainda dentro do limite de ~30s
      # do API Gateway pra uma resposta síncrona.
      Timeout: 28
      Environment:
        Variables:
          TABLE_NAME: !Ref FinancasTable
          API_KEY: !Ref ApiKeyValue
          PLUGGY_CLIENT_ID: !Ref PluggyClientId
          PLUGGY_CLIENT_SECRET: !Ref PluggyClientSecret
          PLUGGY_ITEM_IDS: !Ref PluggyItemIds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FinancasTable
      Events:
        GetAll:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancasHttpApi
            Path: /data
            Method: get
        Mutate:
          Type: HttpApi
          Properties:
            ApiId: !Ref FinancasHttpApi
            Path: /data
            Method: post

  # Envia todo dia às 20h (horário de Brasília, UTC-3, sem horário de verão)
  # um lembrete fixo no WhatsApp pra revisar as finanças do dia, via
  # CallMeBot (não precisa de conta Meta Business). Não consulta o
  # DynamoDB — a mensagem não depende de nenhum dado real.
  LembreteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: lembrete.handler
      Timeout: 15
      Environment:
        Variables:
          CALLMEBOT_PHONE: !Ref WhatsAppRecipientNumber
          CALLMEBOT_APIKEY: !Ref CallMeBotApiKey
      Events:
        LembreteDiario:
          Type: Schedule
          Properties:
            Schedule: "cron(0 23 * * ? *)"
            Description: "Lembrete diário no WhatsApp às 20h (horário de Brasília)"
            Enabled: true

  # Sincroniza automaticamente, 1x por dia, as transações das contas
  # conectadas na Pluggy (Open Finance via Meu Pluggy). Roda de manhã cedo,
  # antes do horário em que o usuário costuma abrir o app. O botão
  # "Atualizar" na tela de Despesas chama a mesma lógica sob demanda, via
  # a ação "syncPluggy" da FinancasFunction — essa Lambda aqui é só o
  # agendamento automático.
  PluggySyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: pluggy-sync.handler
      Timeout: 60
      Environment:
        Variables:
          TABLE_NAME: !Ref FinancasTable
          PLUGGY_CLIENT_ID: !Ref PluggyClientId
          PLUGGY_CLIENT_SECRET: !Ref PluggyClientSecret
          PLUGGY_ITEM_IDS: !Ref PluggyItemIds
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref FinancasTable
      Events:
        SincronizacaoDiaria:
          Type: Schedule
          Properties:
            Schedule: "cron(0 9 * * ? *)"
            Description: "Sincronização diária com a Pluggy às 6h (horário de Brasília)"
            Enabled: true

  FinancasHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - x-api-key

Outputs:
  ApiUrl:
    Description: URL da API — cole em js/config.js
    Value: !Sub "https://${FinancasHttpApi}.execute-api.${AWS::Region}.amazonaws.com/data"
  TableName:
    Description: Nome da tabela DynamoDB criada
    Value: !Ref FinancasTable
